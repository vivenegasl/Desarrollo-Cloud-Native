name: CI/CD Pipeline - Cloud Native TicketFlow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Maven Build and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar pruebas unitarias con Maven
        working-directory: "Sumativa 1/ticket-service"
        run: mvn clean verify -B

  build-and-push-docker:
    name: Build and Push Docker Image
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v5
        with:
          context: "Sumativa 1/ticket-service"
          file: "Sumativa 1/ticket-service/Dockerfile"
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ticketflow-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ticketflow-service:${{ github.sha }}

  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: build-and-push-docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "Iniciando despliegue en AWS EC2..."
            sudo mkdir -p /mnt/efs/tickets
            sudo chmod 777 /mnt/efs/tickets
            
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/ticketflow-service:latest"
            echo "Descargando imagen: $IMAGE"
            docker pull $IMAGE
            
            docker stop ticketflow-service 2>/dev/null || true
            docker rm ticketflow-service 2>/dev/null || true
            
            docker run -d \
              --name ticketflow-service \
              --restart always \
              -p 8080:8080 \
              -v /mnt/efs/tickets:/mnt/efs/tickets \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e AWS_REGION=${{ secrets.AWS_REGION || 'us-east-1' }} \
              -e AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET || 'ticketflow-storage-duoc-vjvl' }} \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e EFS_MOUNT_PATH=/mnt/efs/tickets \
              $IMAGE
            
            echo "Verificando salud de la aplicacion..."
            sleep 15
            curl -f http://localhost:8080/actuator/health || exit 1
            echo "Despliegue completado exitosamente."
