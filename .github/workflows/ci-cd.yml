name: CI/CD Pipeline - Cloud Native TicketFlow

# ==============================================================================
# Pipeline Automatizado Unificado de Alto Rendimiento (Fast CI/CD)
# Asignatura: Desarrollo Cloud Native (CDY2204) - Duoc UC
# Criterio 6: Imagen Docker en Docker Hub + Despliegue en EC2 (20 pts)
# ==============================================================================

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  pipeline:
    name: Build, Test, Docker Hub and Deploy to AWS EC2
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout del codigo fuente
        uses: actions/checkout@v4

      - name: 2. Configurar JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 3. Compilar y ejecutar pruebas unitarias con Maven
        working-directory: "Sumativa 1/ticket-service"
        run: mvn clean package -B

      - name: 4. Configurar Docker Buildx
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: 5. Iniciar sesion en Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 6. Construir y publicar imagen en Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: "Sumativa 1/ticket-service"
          file: "Sumativa 1/ticket-service/Dockerfile"
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ticketflow-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ticketflow-service:${{ github.sha }}

      - name: 7. Desplegar automaticamente en AWS EC2 via SSH
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "=========================================================="
            echo "DESPLIEGUE CONTINUO EN AWS EC2 - CLOUD NATIVE"
            echo "=========================================================="
            
            # Asegurar directorio de Amazon EFS
            sudo mkdir -p /mnt/efs/tickets
            sudo chmod 777 /mnt/efs/tickets
            
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/ticketflow-service:latest"
            echo "Descargando imagen actualizada desde Docker Hub: $IMAGE"
            docker pull $IMAGE
            
            echo "Deteniendo contenedor previo si existe..."
            docker stop ticketflow-service 2>/dev/null || true
            docker rm ticketflow-service 2>/dev/null || true
            
            echo "Iniciando nuevo contenedor con volumen Amazon EFS..."
            docker run -d \
              --name ticketflow-service \
              --restart always \
              -p 8080:8080 \
              -v /mnt/efs/tickets:/mnt/efs/tickets \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e AWS_REGION=${{ secrets.AWS_REGION || 'us-east-1' }} \
              -e AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET || 'ticketflow-storage-duoc-vjvl' }} \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e EFS_MOUNT_PATH=/mnt/efs/tickets \
              $IMAGE
            
            echo "Verificando salud del microservicio (Healthcheck)..."
            sleep 15
            curl -f http://localhost:8080/actuator/health || exit 1
            
            echo "=========================================================="
            echo "DESPLIEGUE EXITOSO EN AWS EC2 (Estado: UP)"
            echo "=========================================================="
