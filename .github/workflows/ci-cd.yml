name: CI/CD Pipeline - Cloud Native TicketFlow

# ==============================================================================
# Pipeline de Integración y Despliegue Continuo (CI/CD)
# Asignatura: Desarrollo Cloud Native (CDY2204) - Duoc UC
# Criterio 6: Imagen Docker en Docker Hub + Despliegue en EC2 (20 pts)
# ==============================================================================

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # Etapa 1: Compilación y Pruebas Unitarias con Maven
  # ============================================================================
  build-and-test:
    name: 1. Maven Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y ejecutar pruebas con Maven
        working-directory: "Sumativa 1/ticket-service"
        run: mvn clean package -B

  # ============================================================================
  # Etapa 2: Construcción y Publicación en Docker Hub
  # ============================================================================
  docker-build-push:
    name: 2. Docker Hub Build & Push
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen multi-stage
        uses: docker/build-push-action@v5
        with:
          context: "Sumativa 1/ticket-service"
          file: "Sumativa 1/ticket-service/Dockerfile"
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ticketflow-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ticketflow-service:${{ github.sha }}

  # ============================================================================
  # Etapa 3: Despliegue Automatizado en AWS EC2 con EFS
  # ============================================================================
  deploy-to-ec2:
    name: 3. Deploy to AWS EC2
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "=========================================================="
            echo "DESPLIEGUE CONTINUO EN AWS EC2 - CLOUD NATIVE"
            echo "=========================================================="
            
            # Asegurar directorio de Amazon EFS
            sudo mkdir -p /mnt/efs/tickets
            sudo chmod 777 /mnt/efs/tickets
            
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/ticketflow-service:latest"
            echo "Descargando imagen actualizada desde Docker Hub: $IMAGE"
            docker pull $IMAGE
            
            echo "Deteniendo contenedor previo si existe..."
            docker stop ticketflow-service 2>/dev/null || true
            docker rm ticketflow-service 2>/dev/null || true
            
            echo "Iniciando nuevo contenedor con volumen Amazon EFS..."
            docker run -d \
              --name ticketflow-service \
              --restart always \
              -p 8080:8080 \
              -v /mnt/efs/tickets:/mnt/efs/tickets \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e AWS_REGION=${{ secrets.AWS_REGION || 'us-east-1' }} \
              -e AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET || 'ticketflow-storage-duoc-vjvl' }} \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e EFS_MOUNT_PATH=/mnt/efs/tickets \
              -e JAVA_OPTS="-Xms256m -Xmx512m -XX:+UseContainerSupport" \
              $IMAGE
            
            echo "Esperando inicializacion del microservicio..."
            READY=0
            for i in $(seq 1 15); do
              echo "Comprobando /actuator/health (intento $i/15)..."
              if curl -s -f http://localhost:8080/actuator/health | grep -q "UP"; then
                echo "=========================================================="
                echo "DESPLIEGUE EXITOSO EN AWS EC2 (Microservicio en linea: UP)"
                echo "=========================================================="
                READY=1
                break
              fi
              sleep 4
            done
            
            if [ $READY -ne 1 ]; then
              echo "Error: El microservicio no respondio UP en el tiempo esperado."
              echo "=== REGISTROS DE SPRING BOOT EN EL CONTENEDOR ==="
              docker logs --tail 40 ticketflow-service
              exit 1
            fi
